<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Register — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #F7F5F0;
  --surface:     #FFFFFF;
  --surface2:    #FAFAF8;
  --border:      #DDD9D0;
  --border2:     #C8C4BB;
  --sage:        #3D7A5E;
  --sage2:       #2E6049;
  --sage-bg:     #EAF4EE;
  --sage-border: #B8DEC9;
  --red:         #C0392B;
  --red-bg:      #FDECEA;
  --amber:       #B45309;
  --amber-bg:    #FEF3E2;
  --green:       #166534;
  --green-bg:    #DCFCE7;
  --text:        #1C1C1A;
  --text2:       #4A4844;
  --text3:       #7A7772;
  --text4:       #A8A4A0;
  --sans:        'Plus Jakarta Sans', system-ui, sans-serif;
  --serif:       'Lora', Georgia, serif;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ── Card ──────────────────────────────────────────── */
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 8px 48px rgba(28,28,26,.13);
  padding: 44px 52px 48px;
  max-width: 440px;
  width: 100%;
  text-align: center;
}

.auth-icon {
  width: 62px;
  height: 62px;
  border-radius: 15px;
  background: var(--sage-bg);
  border: 1px solid var(--sage-border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 26px;
}

.auth-title {
  font-family: var(--serif);
  font-size: 1.7rem;
  color: var(--text);
  margin-bottom: 4px;
}
.auth-sub {
  font-size: .84rem;
  color: var(--text3);
  margin-bottom: 28px;
}

/* ── Tabs ──────────────────────────────────────────── */
.tab-row {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 28px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  padding: 9px 0;
  border: none;
  background: transparent;
  border-radius: 7px;
  font-family: var(--sans);
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text3);
  cursor: pointer;
  transition: all .18s;
}
.tab-btn.active {
  background: var(--surface);
  color: var(--sage);
  box-shadow: 0 1px 6px rgba(28,28,26,.1);
}

/* ── Forms ─────────────────────────────────────────── */
.form-panel { display: none; }
.form-panel.active { display: block; }

.field { text-align: left; margin-bottom: 16px; }
.field label {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 7px;
}
.field input {
  width: 100%;
  padding: 12px 15px;
  border: 1.5px solid var(--border2);
  border-radius: 9px;
  font-family: var(--sans);
  font-size: .93rem;
  color: var(--text);
  background: var(--surface2);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.field input:focus {
  border-color: var(--sage);
  box-shadow: 0 0 0 3px rgba(61,122,94,.1);
  background: var(--surface);
}
.field input.error {
  border-color: var(--red);
  background: var(--red-bg);
}

/* Password strength bar */
.pw-strength-wrap { margin-top: 8px; display: none; }
.pw-strength-wrap.show { display: block; }
.pw-strength-bar {
  height: 4px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
}
.pw-strength-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .3s, background .3s;
  width: 0%;
}
.pw-strength-label {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .08em;
  margin-top: 5px;
}

/* ── Buttons ───────────────────────────────────────── */
.btn-auth {
  width: 100%;
  padding: 13px;
  background: var(--sage);
  color: white;
  border: none;
  border-radius: 9px;
  font-family: var(--sans);
  font-size: .9rem;
  font-weight: 700;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .18s;
  margin-top: 6px;
  position: relative;
}
.btn-auth:hover {
  background: var(--sage2);
  transform: translateY(-1px);
  box-shadow: 0 4px 18px rgba(61,122,94,.28);
}
.btn-auth:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-auth .btn-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Alert boxes ───────────────────────────────────── */
.alert {
  border-radius: 9px;
  font-size: .82rem;
  padding: 11px 14px;
  margin-bottom: 18px;
  display: none;
  text-align: left;
  line-height: 1.5;
}
.alert.show { display: block; }
.alert-err  { background: var(--red-bg);   border: 1px solid rgba(192,57,43,.2); color: var(--red); }
.alert-ok   { background: var(--green-bg); border: 1px solid rgba(22,101,52,.2);  color: var(--green); }
.alert-warn { background: var(--amber-bg); border: 1px solid rgba(180,83,9,.18); color: var(--amber); }

/* ── Password visibility toggle ───────────────────── */
.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text4);
  font-size: .82rem;
  font-family: var(--sans);
  font-weight: 600;
  padding: 2px 4px;
  transition: color .15s;
}
.pw-toggle:hover { color: var(--sage); }

/* ── Divider ───────────────────────────────────────── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  color: var(--text4);
  font-size: .72rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Switch link ───────────────────────────────────── */
.switch-hint {
  font-size: .8rem;
  color: var(--text3);
  margin-top: 18px;
}
.switch-hint a {
  color: var(--sage);
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}
.switch-hint a:hover { text-decoration: underline; }

/* ── Requirements list ─────────────────────────────── */
.req-list {
  text-align: left;
  list-style: none;
  margin-top: 8px;
  display: none;
}
.req-list.show { display: block; }
.req-item {
  font-size: .72rem;
  color: var(--text4);
  padding: 2px 0;
  transition: color .2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.req-item::before {
  content: '○';
  font-size: .6rem;
  flex-shrink: 0;
  transition: all .2s;
}
.req-item.met { color: var(--sage); }
.req-item.met::before { content: '●'; }

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
}
.shake { animation: shake .35s ease; }

@media(max-width:500px){
  .auth-card { padding: 32px 22px 36px; }
}
</style>
</head>
<body>
<div class="auth-card" id="authCard">

  <div class="auth-icon">🏥</div>
  <h2 class="auth-title">Clinic Register</h2>
  <p class="auth-sub">Patient management for your clinic</p>

  <!-- Tabs -->
  <div class="tab-row">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn"        id="tabSignup" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- ══ LOGIN FORM ══ -->
  <div class="form-panel active" id="loginPanel">
    <div class="alert alert-err" id="loginErr"></div>
    <div class="alert alert-ok"  id="loginOk"></div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Enter your username"
             autocomplete="username" autofocus>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="loginPassword" placeholder="Enter your password"
               autocomplete="current-password" style="padding-right:56px">
        <button class="pw-toggle" type="button" onclick="togglePw('loginPassword', this)">Show</button>
      </div>
    </div>

    <button class="btn-auth" id="loginBtn" onclick="doLogin()">Sign In →</button>

    <div class="switch-hint">
      Don't have an account? <a onclick="switchTab('signup')">Create one</a>
    </div>
  </div>

  <!-- ══ SIGNUP FORM ══ -->
  <div class="form-panel" id="signupPanel">
    <div class="alert alert-err"  id="signupErr"></div>
    <div class="alert alert-ok"   id="signupOk"></div>
    <div class="alert alert-warn" id="signupWarn">
      ⚠ Only authorised clinic staff should create accounts.
    </div>

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="e.g. Dr. Priya Sharma"
             autocomplete="name">
    </div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="signupUsername" placeholder="Choose a username (no spaces)"
             autocomplete="username" oninput="validateUsername(this)">
    </div>

    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="signupPassword" placeholder="Create a strong password"
               autocomplete="new-password" style="padding-right:56px"
               oninput="checkStrength(this.value); checkReqs(this.value)">
        <button class="pw-toggle" type="button" onclick="togglePw('signupPassword', this)">Show</button>
      </div>
      <div class="pw-strength-wrap" id="strengthWrap">
        <div class="pw-strength-bar"><div class="pw-strength-fill" id="strengthFill"></div></div>
        <div class="pw-strength-label" id="strengthLabel"></div>
      </div>
      <ul class="req-list" id="reqList">
        <li class="req-item" id="req-len">At least 6 characters</li>
        <li class="req-item" id="req-upper">One uppercase letter</li>
        <li class="req-item" id="req-num">One number</li>
      </ul>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="signupConfirm" placeholder="Re-enter your password"
               autocomplete="new-password" style="padding-right:56px"
               oninput="checkConfirm()">
        <button class="pw-toggle" type="button" onclick="togglePw('signupConfirm', this)">Show</button>
      </div>
    </div>

    <button class="btn-auth" id="signupBtn" onclick="doSignup()">Create Account →</button>

    <div class="switch-hint">
      Already have an account? <a onclick="switchTab('login')">Sign in</a>
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════
   AUTH — Sign In + Sign Up
════════════════════════════════════════════════════ */

// ── Tab switching ──────────────────────────────────
function switchTab(tab) {
  document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
  document.getElementById('signupPanel').classList.toggle('active', tab === 'signup');
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  clearAlerts();
  if (tab === 'login')  document.getElementById('loginUsername').focus();
  if (tab === 'signup') {
    document.getElementById('signupWarn').classList.add('show');
    document.getElementById('signupName').focus();
  }
}

// ── Password visibility ────────────────────────────
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text';     btn.textContent = 'Hide'; }
  else                         { inp.type = 'password'; btn.textContent = 'Show'; }
}

// ── Username validation ────────────────────────────
function validateUsername(el) {
  el.value = el.value.replace(/\s/g, '').toLowerCase();
}

// ── Password strength ──────────────────────────────
function checkStrength(pw) {
  const wrap  = document.getElementById('strengthWrap');
  const fill  = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  const reqs  = document.getElementById('reqList');

  if (!pw) {
    wrap.classList.remove('show');
    reqs.classList.remove('show');
    return;
  }
  wrap.classList.add('show');
  reqs.classList.add('show');

  let score = 0;
  if (pw.length >= 6)          score++;
  if (pw.length >= 10)         score++;
  if (/[A-Z]/.test(pw))        score++;
  if (/[0-9]/.test(pw))        score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    { pct: '15%',  color: '#C0392B', text: 'Very Weak' },
    { pct: '32%',  color: '#E67E22', text: 'Weak' },
    { pct: '55%',  color: '#F1C40F', text: 'Fair' },
    { pct: '78%',  color: '#27AE60', text: 'Strong' },
    { pct: '100%', color: '#16A085', text: 'Excellent' },
  ];
  const lvl = levels[Math.min(score, 4)];
  fill.style.width      = lvl.pct;
  fill.style.background = lvl.color;
  label.textContent     = lvl.text;
  label.style.color     = lvl.color;
}

function checkReqs(pw) {
  setReq('req-len',   pw.length >= 6);
  setReq('req-upper', /[A-Z]/.test(pw));
  setReq('req-num',   /[0-9]/.test(pw));
}

function setReq(id, met) {
  document.getElementById(id).classList.toggle('met', met);
}

function checkConfirm() {
  const pw  = document.getElementById('signupPassword').value;
  const cf  = document.getElementById('signupConfirm');
  if (cf.value && cf.value !== pw) {
    cf.classList.add('error');
  } else {
    cf.classList.remove('error');
  }
}

// ── Alert helpers ──────────────────────────────────
function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}
function clearAlerts() {
  ['loginErr','loginOk','signupErr','signupOk'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('show');
    el.textContent = '';
  });
}
function shake() {
  const card = document.getElementById('authCard');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
}

// ═══════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════
document.getElementById('loginUsername').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  clearAlerts();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');

  if (!username || !password) {
    showAlert('loginErr', 'Please enter both username and password.');
    shake(); return;
  }

  btn.disabled    = true;
  btn.innerHTML   = '<span class="btn-spinner"></span>Signing in…';

  try {
    const res  = await fetch('/api/login', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert('loginErr', data.error || 'Invalid credentials. Please try again.');
      shake();
      btn.disabled  = false;
      btn.innerHTML = 'Sign In →';
      return;
    }
    showAlert('loginOk', '✓ Signed in! Redirecting…');
    setTimeout(() => { window.location.href = '/'; }, 700);

  } catch(e) {
    showAlert('loginErr', 'Cannot connect to server.');
    shake();
    btn.disabled  = false;
    btn.innerHTML = 'Sign In →';
  }
}

// ═══════════════════════════════════════════════════
//  SIGN UP
// ═══════════════════════════════════════════════════
document.getElementById('signupConfirm').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSignup();
});

async function doSignup() {
  clearAlerts();
  document.getElementById('signupWarn').classList.add('show');

  const fullName = document.getElementById('signupName').value.trim();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirm  = document.getElementById('signupConfirm').value;
  const btn      = document.getElementById('signupBtn');

  // Client-side validation
  if (!fullName) {
    showAlert('signupErr', 'Please enter your full name.');
    shake(); return;
  }
  if (!username || username.length < 3) {
    showAlert('signupErr', 'Username must be at least 3 characters.');
    shake(); return;
  }
  if (!/^[a-z0-9_]+$/.test(username)) {
    showAlert('signupErr', 'Username can only contain letters, numbers, and underscores.');
    shake(); return;
  }
  if (password.length < 6) {
    showAlert('signupErr', 'Password must be at least 6 characters.');
    shake(); return;
  }
  if (!/[A-Z]/.test(password)) {
    showAlert('signupErr', 'Password must contain at least one uppercase letter.');
    shake(); return;
  }
  if (!/[0-9]/.test(password)) {
    showAlert('signupErr', 'Password must contain at least one number.');
    shake(); return;
  }
  if (password !== confirm) {
    showAlert('signupErr', 'Passwords do not match.');
    document.getElementById('signupConfirm').classList.add('error');
    shake(); return;
  }

  btn.disabled    = true;
  btn.innerHTML   = '<span class="btn-spinner"></span>Creating account…';

  try {
    const res  = await fetch('/api/signup', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ username, password, fullName })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert('signupErr', data.error || 'Signup failed. Please try again.');
      shake();
      btn.disabled  = false;
      btn.innerHTML = 'Create Account →';
      return;
    }

    // Success — auto sign in
    showAlert('signupOk', '✓ Account created! Signing you in…');
    btn.innerHTML = '<span class="btn-spinner"></span>Signing in…';

    // Auto-login after signup
    const loginRes  = await fetch('/api/login', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ username, password })
    });
    if (loginRes.ok) {
      setTimeout(() => { window.location.href = '/'; }, 700);
    } else {
      showAlert('signupOk', '✓ Account created! Please sign in.');
      setTimeout(() => switchTab('login'), 1200);
      btn.disabled  = false;
      btn.innerHTML = 'Create Account →';
    }

  } catch(e) {
    showAlert('signupErr', 'Cannot connect to server.');
    shake();
    btn.disabled  = false;
    btn.innerHTML = 'Create Account →';
  }
}
</script>
</body>
</html>
