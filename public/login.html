<!DOCTYPE html>
<html>
<head>
<title>Clinic Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:35px;
border-radius:16px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
margin-top:0;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:12px;
background:#2e7d5b;
color:white;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h2>Clinic Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

async function login(){

const res = await fetch('/api/login',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

username:
document.getElementById('username').value,

password:
document.getElementById('password').value

})

});

const data = await res.json();

if(res.ok){

location.href='/';

}else{

alert(data.error);

}

}

</script>

</body>
</html>
