<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Register — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #F7F5F0;
  --surface:     #FFFFFF;
  --surface2:    #FAFAF8;
  --border:      #DDD9D0;
  --border2:     #C8C4BB;
  --sage:        #3D7A5E;
  --sage2:       #2E6049;
  --sage-bg:     #EAF4EE;
  --sage-border: #B8DEC9;
  --red:         #C0392B;
  --red-bg:      #FDECEA;
  --green:       #166534;
  --green-bg:    #DCFCE7;
  --text:        #1C1C1A;
  --text2:       #4A4844;
  --text3:       #7A7772;
  --text4:       #A8A4A0;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --serif:'Lora',Georgia,serif;
}
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 8px 40px rgba(28,28,26,.12);
  padding: 48px 52px;
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.login-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--sage-bg);
  border: 1px solid var(--sage-border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  font-size: 28px;
}
.login-title {
  font-family: var(--serif);
  font-size: 1.75rem;
  color: var(--text);
  margin-bottom: 6px;
}
.login-sub {
  font-size: .85rem;
  color: var(--text3);
  margin-bottom: 28px;
}
/* ── Tab switcher ─────────────────────────────────── */
.tab-row {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 28px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  padding: 9px 0;
  border: none;
  background: transparent;
  border-radius: 7px;
  font-family: var(--sans);
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text3);
  cursor: pointer;
  transition: all .18s;
}
.tab-btn.active {
  background: var(--surface);
  color: var(--sage);
  box-shadow: 0 1px 6px rgba(28,28,26,.1);
}
/* ── Panels ───────────────────────────────────────── */
.panel { display: none; }
.panel.active { display: block; }
/* ── Fields (same as original) ───────────────────── */
.field {
  text-align: left;
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  font-family: var(--sans);
  font-size: .95rem;
  color: var(--text);
  background: var(--surface2);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.field input:focus {
  border-color: var(--sage);
  box-shadow: 0 0 0 3px rgba(61,122,94,.12);
}
/* ── Button (same as original) ───────────────────── */
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--sage);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: var(--sans);
  font-size: .92rem;
  font-weight: 700;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .18s;
  margin-top: 6px;
}
.btn-login:hover {
  background: var(--sage2);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(61,122,94,.3);
}
.btn-login:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}
/* ── Error / Success boxes ────────────────────────── */
.error-box {
  background: var(--red-bg);
  border: 1px solid rgba(192,57,43,.2);
  border-radius: 8px;
  color: var(--red);
  font-size: .82rem;
  padding: 10px 14px;
  margin-bottom: 18px;
  display: none;
  text-align: left;
}
.success-box {
  background: var(--green-bg);
  border: 1px solid rgba(22,101,52,.2);
  border-radius: 8px;
  color: var(--green);
  font-size: .82rem;
  padding: 10px 14px;
  margin-bottom: 18px;
  display: none;
  text-align: left;
}
/* ── Switch hint ──────────────────────────────────── */
.switch-hint {
  font-size: .8rem;
  color: var(--text3);
  margin-top: 16px;
}
.switch-hint a {
  color: var(--sage);
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}
.switch-hint a:hover { text-decoration: underline; }
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
}
.shake { animation: shake .35s ease !important; border-color: var(--red) !important; }
@media(max-width:500px){
  .login-card { padding: 32px 24px; }
}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🏥</div>
    <h2 class="login-title">Clinic Register</h2>
    <p class="login-sub">Patient management system</p>

    <!-- Tab switcher -->
    <div class="tab-row">
      <button class="tab-btn active" id="tabLogin"  onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn"        id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- ══ SIGN IN PANEL ══ -->
    <div class="panel active" id="loginPanel">
      <div class="error-box" id="loginError"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In →</button>

      <div class="switch-hint">
        Don't have an account? <a onclick="switchTab('signup')">Sign Up</a>
      </div>
    </div>

    <!-- ══ SIGN UP PANEL ══ -->
    <div class="panel" id="signupPanel">
      <div class="error-box"   id="signupError"></div>
      <div class="success-box" id="signupSuccess"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password" autocomplete="new-password">
      </div>

      <button class="btn-login" id="signupBtn" onclick="doSignup()">Create Account →</button>

      <div class="switch-hint">
        Already have an account? <a onclick="switchTab('login')">Sign In</a>
      </div>
    </div>

  </div>

<script>
  // ── Tab switching ──────────────────────────────────
  function switchTab(tab) {
    document.getElementById('loginPanel').classList.toggle('active',  tab === 'login');
    document.getElementById('signupPanel').classList.toggle('active', tab === 'signup');
    document.getElementById('tabLogin').classList.toggle('active',    tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active',   tab === 'signup');
    ['loginError','signupError','signupSuccess'].forEach(function(id) {
      document.getElementById(id).style.display = 'none';
    });
    if (tab === 'login')  document.getElementById('loginUsername').focus();
    if (tab === 'signup') document.getElementById('signupUsername').focus();
  }

  // ── Keyboard navigation ────────────────────────────
  document.getElementById('loginUsername').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('loginPassword').focus(); });
  document.getElementById('loginPassword').addEventListener('keydown', function(e) { if(e.key==='Enter') doLogin(); });
  document.getElementById('signupUsername').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('signupPassword').focus(); });
  document.getElementById('signupPassword').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('signupConfirm').focus(); });
  document.getElementById('signupConfirm').addEventListener('keydown', function(e) { if(e.key==='Enter') doSignup(); });

  // ── SIGN IN ────────────────────────────────────────
  async function doLogin() {
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn      = document.getElementById('loginBtn');
    var errBox   = document.getElementById('loginError');

    if (!username || !password) {
      showError('loginError', 'Please enter both username and password.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';
    errBox.style.display = 'none';

    try {
      var res  = await fetch('/api/login', {
        method:      'POST',
        credentials: 'include',
        headers:     { 'Content-Type': 'application/json' },
        body:        JSON.stringify({ username: username, password: password })
      });
      var data = await res.json();

      if (!res.ok) {
        showError('loginError', data.error || 'Invalid credentials. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Sign In →';
        return;
      }

      // Success — redirect to main app
      window.location.href = '/';

    } catch(e) {
      showError('loginError', 'Cannot connect to server. Please check the server is running.');
      btn.disabled    = false;
      btn.textContent = 'Sign In →';
    }
  }

  // ── SIGN UP ────────────────────────────────────────
  async function doSignup() {
    var username = document.getElementById('signupUsername').value.trim();
    var password = document.getElementById('signupPassword').value;
    var confirm  = document.getElementById('signupConfirm').value;
    var btn      = document.getElementById('signupBtn');

    document.getElementById('signupError').style.display   = 'none';
    document.getElementById('signupSuccess').style.display = 'none';

    if (!username) {
      showError('signupError', 'Please enter a username.');
      return;
    }
    if (!password) {
      showError('signupError', 'Please enter a password.');
      return;
    }
    if (password !== confirm) {
      showError('signupError', 'Passwords do not match.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Creating account…';

    try {
      var res  = await fetch('/api/signup', {
        method:      'POST',
        credentials: 'include',
        headers:     { 'Content-Type': 'application/json' },
        body:        JSON.stringify({ username: username, password: password })
      });
      var data = await res.json();

      if (!res.ok) {
        showError('signupError', data.error || 'Sign up failed. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Create Account →';
        return;
      }

      // Show success message
      var successBox = document.getElementById('signupSuccess');
      successBox.textContent = '✓ Account created! You can now sign in.';
      successBox.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = 'Create Account →';

      // Clear fields
      document.getElementById('signupUsername').value = '';
      document.getElementById('signupPassword').value = '';
      document.getElementById('signupConfirm').value  = '';

      // Auto switch to Sign In after 1.5s
      setTimeout(function() { switchTab('login'); }, 1500);

    } catch(e) {
      showError('signupError', 'Cannot connect to server. Please check the server is running.');
      btn.disabled    = false;
      btn.textContent = 'Create Account →';
    }
  }

  // ── Helper ─────────────────────────────────────────
  function showError(id, msg) {
    var box = document.getElementById(id);
    box.textContent   = msg;
    box.style.display = 'block';
    var card = document.querySelector('.login-card');
    card.style.animation = 'none';
    card.classList.add('shake');
    setTimeout(function() { card.classList.remove('shake'); }, 400);
  }
</script>
</body>
</html>
